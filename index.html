<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Загадки проклятого аукциона</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Стартовый экран */
        .start-screen {
            background: #16213e;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
        }

        .game-title {
            font-size: 32px;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 16px;
        }

        .story-text {
            text-align: left;
            margin: 20px 0;
            line-height: 1.6;
            color: #ccc;
        }

        .rules-list {
            text-align: left;
            background: #0f3460;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }

        .rules-list li {
            margin: 10px 0;
            margin-left: 20px;
        }

        .start-btn {
            background: #e94560;
            border: none;
            color: white;
            padding: 14px 30px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Карточка локации */
        .location-card {
            background: #16213e;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .location-image {
            width: 100%;
            height: 200px;
            background: #0f3460;
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            overflow: hidden;
        }

        .location-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .location-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #e94560;
        }

        .location-description {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ccc;
        }

        /* Очки дедукции */
        .deduction-bar {
            background: #0f3460;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .deduction-score {
            font-size: 20px;
            font-weight: bold;
            color: #f9a826;
        }

        .deduction-buy {
            background: #e94560;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Карточки улик */
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: #0f3460;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .card:hover {
            transform: translateX(4px);
        }

        .card.discovered {
            opacity: 0.6;
            cursor: default;
        }

        .card-image {
            width: 80px;
            height: 80px;
            background: #1a1a2e;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            flex: 1;
        }

        .card-type {
            font-size: 12px;
            color: #f9a826;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card-text {
            font-size: 14px;
            color: #bbb;
            line-height: 1.4;
        }

        .card-cost {
            font-size: 12px;
            color: #e94560;
            margin-top: 8px;
        }

        /* Кнопки выбора */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            background: #e94560;
            border: none;
            color: white;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .action-btn.disabled {
            background: #555;
            cursor: not-allowed;
        }

        .reset-btn {
            background: none;
            border: 1px solid #555;
            color: #888;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            padding: 24px;
        }

        .modal-close {
            background: #e94560;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 40px;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
    // ==================== СЮЖЕТ И ПРАВИЛА ====================
    const STORY = {
        title: "Загадки проклятого аукциона",
        opening: "Лондон, 1888 год. Полночь. Вы — известный артефакт-детектив, получивший анонимное приглашение на закрытый аукцион в особняке сэра Генри Блэквуда. Когда вы прибываете, вместо оживлённых торгов вас встречает мёртвая тишина... и тело самого сэра Генри.\n\nЗеркало Морфея — легендарный артефакт, способный показывать самые страшные сны — исчезло. Гости впали в летаргию. А вы — единственный, кто может раскрыть тайну и вернуть зеркало.",
        rules: [
            "У вас есть 100 очков дедукции в начале игры.",
            "Каждая улика или свидетельство стоят определённое количество очков.",
            "Чтобы перейти в новую локацию, иногда нужно собрать все улики.",
            "Очки можно пополнить за Telegram Stars (кнопка «Купить очки»).",
            "Ваша цель — найти преступника и вернуть Зеркало Морфея."
        ]
    };

    // ==================== JSON СЮЖЕТ ИГРЫ ====================
    const GAME_DATA = {
        "game_id": "mystery_auction_ep1",
        "start_location": "ballroom",
        "deduction_points": 100,
        "locations": {
            "ballroom": {
                "name": "Бальный зал",
                "background_image": null,
                "description": "Огромный зал в викторианском стиле. Люстра мерцает, по стенам танцуют тени. В центре — тело сэра Генри. Вокруг разбросаны вещи.",
                "cards": [
                    {
                        "id": "clue_glove",
                        "type": "улика",
                        "image": null,
                        "title": "Старая перчатка",
                        "text": "Мужская перчатка из тонкой кожи. На пальце — свежие чернильные пятна и вышитая монограмма 'L.W.'",
                        "deduction_cost": 5,
                        "is_discovered": false,
                        "icon": "🧤"
                    },
                    {
                        "id": "clue_catalog",
                        "type": "улика",
                        "image": null,
                        "title": "Аукционный каталог",
                        "text": "Программа торгов. Лот №7 'Зеркало Морфея' обведен красными чернилами. Рядом приписка: 'Никому не отдам — L.W.'",
                        "deduction_cost": 5,
                        "is_discovered": false,
                        "icon": "📖"
                    },
                    {
                        "id": "npc_chatter",
                        "type": "свидетель",
                        "image": null,
                        "title": "Дрожащий дворецкий",
                        "text": "Старый дворецкий шепчет: 'Мистер Уэбстер из библиотеки враждовал с сэром Генри. Говорили, зеркало должно было достаться ему...'",
                        "deduction_cost": 10,
                        "is_discovered": false,
                        "icon": "👤"
                    }
                ],
                "buttons": [
                    {
                        "text": "🔍 Идти в библиотеку к Уэбстеру",
                        "next_location": "library",
                        "required_clues": ["clue_glove", "clue_catalog"]
                    }
                ]
            },
            "library": {
                "name": "Библиотека",
                "background_image": null,
                "description": "Гигантская комната, полная книг до потолка. Камин почти погас. В кресле у камина сидит мистер Уэбстер и нервно листает какую-то книгу. Увидев вас, он вздрагивает.",
                "cards": [
                    {
                        "id": "clue_letter",
                        "type": "улика",
                        "image": null,
                        "title": "Письмо с угрозами",
                        "text": "В столе Уэбстера найдено письмо: 'Я требую вернуть мне Зеркало. Оно принадлежало моей семье. Вы украли его, сэр Генри. Я заберу его любой ценой. — Л.Уэбстер'",
                        "deduction_cost": 10,
                        "is_discovered": false,
                        "icon": "📜"
                    },
                    {
                        "id": "clue_key",
                        "type": "улика",
                        "image": null,
                        "title": "Старый ключ",
                        "text": "Под креслом Уэбстера блестит старый бронзовый ключ. На табличке выгравировано: 'Секретная комната — кабинет аукциониста'.",
                        "deduction_cost": 5,
                        "is_discovered": false,
                        "icon": "🔑"
                    },
                    {
                        "id": "npc_webster",
                        "type": "подозреваемый",
                        "image": null,
                        "title": "Мистер Уэбстер",
                        "text": "Уэбстер запинается: 'Я... я не убивал его! Зеркало... да, я хотел его вернуть. Но когда я пришёл сюда вечером, сэр Генри уже был мёртв! Я взял каталог, но нашёл только перчатку... Кто-то был здесь до меня!'",
                        "deduction_cost": 15,
                        "is_discovered": false,
                        "icon": "👨‍⚖️"
                    }
                ],
                "buttons": [
                    {
                        "text": "🗝️ Открыть секретную комнату в кабинете",
                        "next_location": "office",
                        "required_clues": ["clue_key"]
                    },
                    {
                        "text": "🔙 Вернуться в бальный зал",
                        "next_location": "ballroom",
                        "required_clues": []
                    }
                ]
            },
            "office": {
                "name": "Кабинет аукциониста",
                "background_image": null,
                "description": "Секретная комната за книжным шкафом. Стол аукциониста завален бумагами. В углу — пустой пьедестал, на котором, вероятно, стояло Зеркало. Рядом — свежие следы.",
                "cards": [
                    {
                        "id": "clue_footprints",
                        "type": "улика",
                        "image": null,
                        "title": "Следы",
                        "text": "На полу — свежие грязные следы. Они ведут к окну. Размер обуви — мужской, примерно 42-го.",
                        "deduction_cost": 5,
                        "is_discovered": false,
                        "icon": "👣"
                    },
                    {
                        "id": "clue_ledger",
                        "type": "улика",
                        "image": null,
                        "title": "Долговая тетрадь",
                        "text": "На столе аукциониста — тетрадь с долгами. Сэр Генри задолжал крупную сумму таинственному 'Покупателю X'. Последняя запись: 'Верну долг Зеркалом'.",
                        "deduction_cost": 10,
                        "is_discovered": false,
                        "icon": "📓"
                    }
                ],
                "buttons": [
                    {
                        "text": "🏆 Завершить расследование и назвать преступника",
                        "next_location": "finale",
                        "required_clues": ["clue_footprints", "clue_ledger", "clue_letter"]
                    },
                    {
                        "text": "🔙 Вернуться в библиотеку",
                        "next_location": "library",
                        "required_clues": []
                    }
                ]
            },
            "finale": {
                "name": "Финал",
                "background_image": null,
                "description": "Вы собрали все улики. Теперь пришло время назвать преступника. Кто же убил сэра Генри и украл Зеркало Морфея?",
                "cards": [],
                "buttons": [
                    {
                        "text": "👨‍⚖️ Мистер Уэбстер — он хотел вернуть семейную реликвию",
                        "next_location": "end",
                        "required_clues": []
                    },
                    {
                        "text": "💰 Аукционист — он задолжал деньги и украл Зеркало",
                        "next_location": "end",
                        "required_clues": []
                    },
                    {
                        "text": "🕵️ Дворецкий — он знал все ходы и выходы",
                        "next_location": "end",
                        "required_clues": []
                    }
                ]
            },
            "end": {
                "name": "Конец игры",
                "background_image": null,
                "description": "Это финал. Чтобы начать заново, нажмите кнопку ниже.",
                "cards": [],
                "buttons": []
            }
        }
    };

    // ==================== СОСТОЯНИЕ ИГРЫ ====================
    let gameState = {
        gameStarted: false,
        currentLocation: GAME_DATA.start_location,
        deductionPoints: GAME_DATA.deduction_points,
        discoveredCards: new Set()
    };

    function saveGame() {
        const toSave = {
            gameStarted: gameState.gameStarted,
            currentLocation: gameState.currentLocation,
            deductionPoints: gameState.deductionPoints,
            discoveredCards: Array.from(gameState.discoveredCards)
        };
        localStorage.setItem('detective_game_save', JSON.stringify(toSave));
    }

    function loadGame() {
        const saved = localStorage.getItem('detective_game_save');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                gameState.gameStarted = data.gameStarted || false;
                gameState.currentLocation = data.currentLocation;
                gameState.deductionPoints = data.deductionPoints;
                gameState.discoveredCards = new Set(data.discoveredCards);
                
                for (const locId in GAME_DATA.locations) {
                    for (const card of GAME_DATA.locations[locId].cards) {
                        card.is_discovered = gameState.discoveredCards.has(card.id);
                    }
                }
            } catch(e) { console.log("Ошибка загрузки сохранения"); }
        }
    }

    function resetGame() {
        gameState.gameStarted = false;
        gameState.currentLocation = GAME_DATA.start_location;
        gameState.deductionPoints = GAME_DATA.deduction_points;
        gameState.discoveredCards.clear();
        for (const locId in GAME_DATA.locations) {
            for (const card of GAME_DATA.locations[locId].cards) {
                card.is_discovered = false;
            }
        }
        localStorage.removeItem('detective_game_save');
        render();
    }

    function canDiscoverCard(card) {
        return !card.is_discovered && gameState.deductionPoints >= card.deduction_cost;
    }

    function discoverCard(card) {
        if (!canDiscoverCard(card)) return false;
        
        gameState.deductionPoints -= card.deduction_cost;
        card.is_discovered = true;
        gameState.discoveredCards.add(card.id);
        saveGame();
        render();
        showModal(card);
        return true;
    }

    function goToLocation(locationId) {
        if (GAME_DATA.locations[locationId]) {
            gameState.currentLocation = locationId;
            saveGame();
            render();
        }
    }

    function showModal(card) {
        const modal = document.getElementById('modal');
        if (modal) {
            document.getElementById('modal-title').textContent = card.title;
            document.getElementById('modal-text').textContent = card.text;
            document.getElementById('modal-type').textContent = card.type;
            document.getElementById('modal-icon').textContent = card.icon || '📋';
            modal.classList.add('active');
        }
    }

    function closeModal() {
        document.getElementById('modal')?.classList.remove('active');
    }

    function haveRequiredClues(requiredIds) {
        if (!requiredIds || requiredIds.length === 0) return true;
        return requiredIds.every(id => gameState.discoveredCards.has(id));
    }

    // Стартовый экран
    function renderStartScreen() {
        const app = document.getElementById('app');
        let rulesHtml = '<ul class="rules-list">';
        for (const rule of STORY.rules) {
            rulesHtml += `<li>${rule}</li>`;
        }
        rulesHtml += '</ul>';
        
        app.innerHTML = `
            <div class="start-screen">
                <div class="game-title">${STORY.title}</div>
                <div class="story-text">${STORY.opening.replace(/\n/g, '<br>')}</div>
                ${rulesHtml}
                <button class="start-btn" id="startGameBtn">🕵️ Начать расследование</button>
                <button class="reset-btn" id="hardResetBtn">🔄 Сбросить сохранения</button>
            </div>
        `;
        
        document.getElementById('startGameBtn').onclick = () => {
            gameState.gameStarted = true;
            saveGame();
            render();
        };
        
        const hardResetBtn = document.getElementById('hardResetBtn');
        if (hardResetBtn) {
            hardResetBtn.onclick = () => {
                localStorage.clear();
                location.reload();
            };
        }
    }

    // Основная игра
    function renderGame() {
        const app = document.getElementById('app');
        const location = GAME_DATA.locations[gameState.currentLocation];
        
        if (!location) {
            app.innerHTML = '<div class="location-card">Ошибка: локация не найдена</div>';
            return;
        }

        let html = `
            <div class="deduction-bar">
                <span>🕵️ Очки дедукции</span>
                <span class="deduction-score">${gameState.deductionPoints}</span>
                <button class="deduction-buy" id="buyStarsBtn">⭐ Купить очки</button>
            </div>
            <div class="location-card">
                <div class="location-image">
                    ${location.background_image ? `<img src="${location.background_image}" alt="">` : `🏛️ ${location.name}`}
                </div>
                <div class="location-name">${location.name}</div>
                <div class="location-description">${location.description}</div>
            </div>
        `;

        if (location.cards && location.cards.length > 0) {
            html += `<div class="cards-grid">`;
            for (const card of location.cards) {
                const canOpen = canDiscoverCard(card);
                html += `
                    <div class="card ${card.is_discovered ? 'discovered' : ''}" data-card-id="${card.id}">
                        <div class="card-image">${card.icon || '📋'}</div>
                        <div class="card-content">
                            <div class="card-type">${card.type}</div>
                            <div class="card-title">${card.title}</div>
                            <div class="card-text">${card.is_discovered ? card.text : '??? Нажмите, чтобы исследовать'}</div>
                            ${!card.is_discovered ? `<div class="card-cost">🔍 Стоимость: ${card.deduction_cost} очков</div>` : ''}
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
        }

        if (location.buttons && location.buttons.length > 0) {
            html += `<div class="action-buttons">`;
            for (const btn of location.buttons) {
                const hasClues = haveRequiredClues(btn.required_clues);
                const disabledClass = !hasClues ? 'disabled' : '';
                html += `
                    <button class="action-btn ${disabledClass}" data-next="${btn.next_location}" ${!hasClues ? 'disabled' : ''}>
                        ${btn.text} ${!hasClues ? '(🔒 Требуются улики)' : ''}
                    </button>
                `;
            }
            html += `</div>`;
        }

        if (gameState.currentLocation !== 'end') {
            html += `<button class="reset-btn" id="resetGameBtn">🔄 Сбросить прогресс и начать заново</button>`;
        } else {
            html += `<button class="reset-btn" id="restartGameBtn">🎮 Начать новую игру</button>`;
        }

        app.innerHTML = html;

        document.querySelectorAll('.card').forEach(cardEl => {
            const cardId = cardEl.dataset.cardId;
            const foundCard = location.cards.find(c => c.id === cardId);
            if (foundCard && !foundCard.is_discovered) {
                cardEl.onclick = () => discoverCard(foundCard);
            }
        });

        document.querySelectorAll('.action-btn').forEach(btn => {
            if (!btn.disabled) {
                btn.onclick = () => {
                    const next = btn.dataset.next;
                    if (next === 'end') {
                        const finalText = btn.textContent;
                        let finalMessage = '';
                        if (finalText.includes('Уэбстер')) finalMessage = 'Вы обвиняете мистера Уэбстера. Он признаётся, что хотел вернуть зеркало, но клянётся, что не убивал. Следы ведут к другому...';
                        else if (finalText.includes('Аукционист')) finalMessage = 'Вы обвиняете аукциониста. Он сознаётся в краже зеркала, но клянётся, что сэр Генри был жив, когда он уходил.';
                        else finalMessage = 'Вы обвиняете дворецкого. Он падает на колени и признаётся во всём! Это он убил сэра Генри и украл зеркало. Дело раскрыто!';
                        alert(finalMessage + '\n\nИгра пройдена! Спасибо за расследование.');
                    }
                    if (next) goToLocation(next);
                };
            }
        });

        const resetBtn = document.getElementById('resetGameBtn');
        if (resetBtn) resetBtn.onclick = resetGame;
        
        const restartBtn = document.getElementById('restartGameBtn');
        if (restartBtn) restartBtn.onclick = resetGame;

        const buyStarsBtn = document.getElementById('buyStarsBtn');
        if (buyStarsBtn) {
            buyStarsBtn.onclick = () => {
                alert('⭐ Покупка очков дедукции за Telegram Stars\n\nФункция будет доступна после настройки FunPay.');
            };
        }
    }

    function render() {
        if (!gameState.gameStarted) {
            renderStartScreen();
        } else {
            renderGame();
        }
    }

    // Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    }

    loadGame();
    render();

    // Модальное окно
    const modalDiv = document.createElement('div');
    modalDiv.id = 'modal';
    modalDiv.className = 'modal';
    modalDiv.innerHTML = `
        <div class="modal-content">
            <div style="font-size: 48px; text-align: center; margin-bottom: 16px;" id="modal-icon">📋</div>
            <div class="card-type" id="modal-type" style="text-align: center;">улика</div>
            <h3 id="modal-title" style="text-align: center; margin: 16px 0;">Заголовок</h3>
            <p id="modal-text" style="line-height: 1.5;">Текст улики</p>
            <button class="modal-close" id="modalCloseBtn">Закрыть</button>
        </div>
    `;
    document.body.appendChild(modalDiv);
    document.getElementById('modalCloseBtn').onclick = closeModal;
    modalDiv.onclick = (e) => { if (e.target === modalDiv) closeModal(); };
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
